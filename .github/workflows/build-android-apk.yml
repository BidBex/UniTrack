name: Build Android & Web Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build UniTrack Android & Web Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --no-audit

      - name: Run Domain Logic Tests
        run: npm test

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Web Application & PWA
        run: npm run build

      - name: Package Android & Mobile Distribution
        run: |
          mkdir -p android-release
          cp -r dist/* android-release/
          cat << 'EOF' > android-release/INSTALL_ON_ANDROID.txt
          UniTrack Academic Calendar - Android Phone Installation Guide
          =============================================================

          Option 1 (Recommended - Native Standalone WebAPK):
          1. Open the app URL in Google Chrome on your Android phone.
          2. Tap the "Android & Mobile" button or the 3-dot Chrome menu.
          3. Tap "Add to Home screen" / "Install app".
          4. UniTrack will install as a native Android WebAPK with launcher icon, full-screen display, and offline caching.

          Option 2 (Host on GitHub Pages / Static Hosting):
          Deploy the contents of the `dist/` directory directly to GitHub Pages to serve your Android app anywhere.
          EOF

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniTrack-Android-Release
          path: |
            android-release/
            dist/
