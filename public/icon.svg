    <rect x="96" y="128" width="320" height="280" rx="28" fill="#ffffff" />
    <path d="M96 128 C96 112.5 108.5 100 124 100 L388 100 C403.5 100 416 112.5 416 128 L416 188 L96 188 Z" fill="#ef4444" />
    
    <!-- Calendar Rings -->
    <rect x="156" y="76" width="24" height="48" rx="12" fill="#312e81" />
    <rect x="332" y="76" width="24" height="48" rx="12" fill="#312e81" />
    
    <!-- Week / Clock Grid Details -->
    <!-- Academic Cap Mini -->
    <polygon points="256,220 336,256 256,292 176,256" fill="#4f46e5" />
    <polygon points="256,292 316,265 316,305 256,332 196,305 196,265" fill="#3730a3" />
    <circle cx="346" cy="270" r="6" fill="#f59e0b" />
    <line x1="336" y1="256" x2="346" y2="270" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    
    <!-- Progress Indicator Dots -->
    <circle cx="160" cy="360" r="14" fill="#10b981" />
    <circle cx="224" cy="360" r="14" fill="#6366f1" />
    <circle cx="288" cy="360" r="14" fill="#f59e0b" />
